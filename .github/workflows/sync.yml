name: Sync Latest Stable Release

permissions:
  contents: write

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-latest-stable-release
  cancel-in-progress: false

jobs:
  sync-stable-release:
    name: Sync latest stable release to main
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: lobehub/lobehub
          TARGET_BRANCH: main
        run: .github/scripts/sync-stable-release.sh
